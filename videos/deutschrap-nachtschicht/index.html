<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <title>NACHTSCHICHT — Official Visualizer</title>
    <link rel="icon" href="data:," />
    <script src="assets/vendor/gsap.min.js"></script>
    <script src="beatmap.js"></script>
    <style>
      @font-face {
        font-family: "Anton";
        src: url("assets/fonts/anton-latin-400-normal.woff2") format("woff2");
        font-weight: 400;
        font-display: block;
      }
      @font-face {
        font-family: "JetBrains Mono";
        src: url("assets/fonts/jetbrains-mono-latin-500-normal.woff2") format("woff2");
        font-weight: 500;
        font-display: block;
      }
      :root {
        --bone: #f0e8d9;
        --amber: #ffa80f;
        --bar: 138px; /* 2.39:1 letterbox inside 16:9 */
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: #000;
      }
      #root {
        position: relative;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #000;
        color: var(--bone);
        font-family: "JetBrains Mono", monospace;
      }
      #film {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        display: block;
      }
      .bar {
        position: absolute;
        left: 0;
        width: 100%;
        height: var(--bar);
        background: #000;
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 0 64px;
        font-size: 17px;
        font-weight: 500;
        letter-spacing: 0.22em;
        text-transform: uppercase;
      }
      #bar-top {
        top: 0;
      }
      #bar-bottom {
        bottom: 0;
      }
      .bar span {
        color: rgba(240, 232, 217, 0.62);
        white-space: nowrap;
      }
      .bar .hot {
        color: var(--amber);
      }
      .rec {
        display: inline-block;
        width: 10px;
        height: 10px;
        margin-right: 14px;
        border-radius: 50%;
        background: #f0281c;
      }
      #stop-card,
      #end-card {
        position: absolute;
        inset: var(--bar) 0;
        display: flex;
      }
      #stop-card {
        align-items: center;
        justify-content: center;
        font-size: 30px;
        letter-spacing: 0.5em;
      }
      #end-card {
        flex-direction: column;
        justify-content: center;
        padding-left: 98px;
        gap: 22px;
      }
      #end-title {
        font-family: "Anton", sans-serif;
        font-size: 132px;
        line-height: 1;
        color: var(--bone);
      }
      #end-rule {
        width: 620px;
        height: 4px;
        background: var(--amber);
        transform-origin: left center;
      }
      #end-sub,
      #end-line {
        font-size: 28px;
        letter-spacing: 0.3em;
        text-transform: uppercase;
      }
      #end-sub {
        color: rgba(240, 232, 217, 0.72);
      }
      #end-line {
        color: var(--amber);
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="60"
      data-width="1920"
      data-height="1080"
    >
      <canvas id="film"></canvas>

      <div id="stop-card" class="clip" data-start="33.4286" data-duration="0.8571" data-track-index="2">
        <span id="stop-text">KEIN SCHLAF.</span>
      </div>

      <div id="end-card">
        <div id="end-title">NACHTSCHICHT</div>
        <div id="end-rule"></div>
        <div id="end-sub">Official Visualizer · 140 BPM · F-Moll</div>
        <div id="end-line">Fehlt nur noch deine Stimme.</div>
      </div>

      <div id="bar-top" class="bar" data-layout-ignore>
        <span id="hud-title"><i class="rec" id="hud-rec"></i>Nachtschicht</span>
        <span id="hud-shot">SZENE 01/01</span>
        <span>Official Visualizer</span>
      </div>
      <div id="bar-bottom" class="bar" data-layout-ignore>
        <span id="hud-tc">TC 00:00:00:00</span>
        <span class="hot">140 BPM · F-Moll</span>
        <span>52.5200° N 13.4050° E · Berlin 03:47</span>
      </div>

      <audio id="bgm" src="assets/bgm.mp3" data-start="0" data-duration="59.98" data-track-index="1" data-volume="1"></audio>
    </div>

    <script src="film.js"></script>
    <script>
      NACHTSCHICHT.ready.then(() => {
        const { bars, DURATION, renderAt } = NACHTSCHICHT;
        const tl = gsap.timeline({ paused: true });

        // The film canvas follows the same clock as the DOM layer.
        const clock = { t: 0 };
        tl.to(clock, { t: DURATION, duration: DURATION, ease: "none", onUpdate: () => renderAt(clock.t) }, 0);

        // Letterbox HUD settles in with the first shot and leaves with the last.
        tl.fromTo(".bar span", { opacity: 0 }, { opacity: 1, duration: 1.2, ease: "power2.out", stagger: 0.08 }, 0.5);
        tl.to("#hud-rec", { opacity: 0.15, duration: bars(0.25), ease: "steps(1)", repeat: 135, yoyo: true }, 0);
        tl.to(".bar span", { opacity: 0, duration: 1.2, ease: "power2.in" }, DURATION - 2.2);

        // Hard stop: the beat drops out for half a bar.
        tl.fromTo("#stop-text", { opacity: 0 }, { opacity: 1, duration: 0.12, ease: "none" }, bars(19.5) + 0.08);

        // End card beside the empty microphone.
        const end = bars(32);
        tl.fromTo("#end-title", { opacity: 0, y: 40 }, { opacity: 1, y: 0, duration: 0.9, ease: "expo.out" }, end + 0.05);
        tl.fromTo("#end-rule", { scaleX: 0 }, { scaleX: 1, duration: 0.9, ease: "expo.out" }, end + 0.35);
        tl.fromTo("#end-sub", { opacity: 0, x: -24 }, { opacity: 1, x: 0, duration: 0.7, ease: "power3.out" }, end + 0.6);
        tl.fromTo("#end-line", { opacity: 0, x: -24 }, { opacity: 1, x: 0, duration: 0.7, ease: "power3.out" }, end + 1.5);
        tl.to("#end-card > div", { opacity: 0, duration: 1.2, ease: "power2.in" }, DURATION - 2.0);

        window.__timelines["main"] = tl;
        if (window.__hfForceTimelineRebind) window.__hfForceTimelineRebind();
      });
    </script>
  </body>
</html>
